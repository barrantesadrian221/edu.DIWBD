spring.application.name=bdDIW

#Configuracion del servidor web embebido Tomcat 11
server.port=8080

#Cpnexion de JDBC a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/BD_DIW
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.NonRegisteringDriver

#Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



